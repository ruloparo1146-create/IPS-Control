<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Iniciar SesiÃ³n</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center" style="height: 100vh;">
  
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-4">
        <div class="card shadow">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">IPS Control</h3>
            <form id="login-form">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" id="email" class="form-control" required value="raul@ipscontrol.com">
              </div>
              <div class="mb-3">
                <label class="form-label">ContraseÃ±a</label>
                <input type="password" id="password" class="form-control" required>
              </div>
              <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div id="mensaje-error" class="text-danger text-center mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('mensaje-error');
      
      errorDiv.innerText = 'Entrando...';

      // Asegurarnos de que supabase estÃ© cargado
      if (!window.supabase) {
        errorDiv.innerText = 'Error: Supabase no estÃ¡ listo. Recarga la pÃ¡gina.';
        return;
      }

      const { data, error } = await window.supabase.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorDiv.innerText = 'Error: ' + error.message;
      } else {
        // Login exitoso, ir al panel principal
        window.location.href = 'index.html';
      }
    });
  </script>
</body>
</html>
