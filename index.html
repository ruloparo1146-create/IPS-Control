<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Color institucional IPS */
    .bg-ips {
      background-color: #50B9C0 !important;
    }
    .btn-ips {
      background-color: #50B9C0;
      border-color: #50B9C0;
      color: white;
    }
    .btn-ips:hover {
      background-color: #3da8af;
      border-color: #3da8af;
      color: white;
    }
  </style>
</head>
<body class="bg-light">
  
  <nav class="navbar navbar-dark bg-ips mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">IPS Control</span>
      <div>
        <span class="text-white me-3" id="user-email"></span>
        <button class="btn btn-sm btn-outline-light" onclick="cerrarSesion()">Salir</button>
      </div>
    </div>
  </nav>

  <div class="container mb-3">
    <!-- BotÃ³n para ir a la Calculadora -->
    <a href="calculadora.html" class="btn btn-ips btn-lg w-100 shadow-sm">
      ðŸ§® Nueva ConversiÃ³n / Calculadora
    </a>
  </div>

  <div class="container">
    <!-- Panel de Supervivencia -->
    <div id="panel-supervivencia" class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <h5 class="card-title">Control de Supervivencia</h5>
        <p class="card-text" id="supervivencia-texto">Calculando...</p>
      </div>
    </div>

    <!-- Resumen -->
    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <h6 class="text-muted">Ultimo Cobro (Euros)</h6>
            <h3 id="ultimo-cobro">--</h3>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <h6 class="text-muted">Total Historico (Euros)</h6>
            <h3 id="total-historico">--</h3>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla de Movimientos -->
    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Ultimos Movimientos</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>Fecha Recibo</th>
                <th>Monto Pesos</th>
                <th>Monto Euros</th>
                <th>Banco</th>
              </tr>
            </thead>
            <tbody id="tabla-cobros">
              <tr><td colspan="4" class="text-center">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. Esperar conexion a Supabase
      let intentos = 0;
      while (typeof window.db === 'undefined') {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          document.getElementById('tabla-cobros').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error: No se pudo conectar a la base de datos.</td></tr>';
          return;
        }
      }

      // 2. Verificar sesion
      const session = await verificarSesion();
      if (!session) {
        window.location.href = 'login.html';
        return;
      }
      document.getElementById('user-email').innerText = session.user.email;

      // 3. Cargar datos de los cobros
      const app = document.getElementById('tabla-cobros');
      try {
        const { data, error } = await window.db
          .from('cobros')
          .select('*')
          .order('recibo_vision_fecha', { ascending: false })
          .limit(10);

        if (error) throw error;
        
        if (!data || data.length === 0) {
          app.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No hay datos registrados.</td></tr>';
          return;
        }

        let html = '';
        let totalEuros = 0;
        
        data.forEach(cobro => {
          if (cobro.monto_euros) totalEuros += parseFloat(cobro.monto_euros);
          
          html += `
            <tr>
              <td>${cobro.recibo_vision_fecha || '-'}</td>
              <td>$${cobro.monto_pesos ? cobro.monto_pesos.toLocaleString('es-AR') : '-'}</td>
              <td>EUR ${cobro.monto_euros ? cobro.monto_euros.toLocaleString('es-ES') : '-'}</td>
              <td><small>${cobro.banco_detalle || '-'}</small></td>
            </tr>`;
        });
        app.innerHTML = html;

        // 4. Actualizar los resÃºmenes (usando EUR en lugar de â‚¬)
        const ultimo = data[0];
        document.getElementById('ultimo-cobro').innerText = `EUR ${ultimo.monto_euros ? ultimo.monto_euros.toLocaleString('es-ES') : 'Pendiente'}`;
        document.getElementById('total-historico').innerText = `EUR ${totalEuros.toLocaleString('es-ES')}`;

        // 5. LÃ³gica de Supervivencia (5 meses despuÃ©s del Ãºltimo recibo)
        const fechaUltimo = new Date(ultimo.recibo_vision_fecha);
        fechaUltimo.setMonth(fechaUltimo.getMonth() + 5);
        
        const panel = document.getElementById('panel-supervivencia');
        panel.className = 'card mb-4 shadow-sm border-success';
        panel.querySelector('.card-body').classList.add('bg-success', 'text-white');
        
        document.getElementById('supervivencia-texto').innerHTML = `
          <strong>Todo en orden</strong><br>
          Proximo tramite estimado: <strong>${fechaUltimo.toLocaleDateString('es-ES')}</strong>`;

      } catch (error) {
        app.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: ${error.message}</td></tr>`;
      }
    });

    // Registrar Service Worker para PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js')
          .then(reg => console.log('Service Worker registrado'))
          .catch(err => console.log('Error SW:', err));
      });
    }
  </script>
</body>
</html>
