<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPS Control - Panel</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">
  
  <nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">IPS Control</span>
      <span class="text-white" id="user-email">Conectando...</span>
    </div>
  </nav>

  <div class="container">
    <div id="panel-supervivencia" class="card mb-4 shadow-sm">
      <div class="card-body text-center">
        <h5 class="card-title">Control de Supervivencia</h5>
        <p class="card-text" id="supervivencia-texto">Calculando...</p>
      </div>
    </div>

    <div class="row mb-4">
      <div class="col-md-6">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <h6 class="text-muted">Ultimo Cobro (Euros)</h6>
            <h3 id="ultimo-cobro">--</h3>
          </div>
        </div>
      </div>
      <div class="col-md-6">
        <div class="card shadow-sm text-center">
          <div class="card-body">
            <h6 class="text-muted">Total Historico (Euros)</h6>
            <h3 id="total-historico">--</h3>
          </div>
        </div>
      </div>
    </div>

    <div class="d-grid gap-2 d-md-flex justify-content-md-center mb-4">
      <button class="btn btn-success btn-lg" onclick="alert('Proximamente: Calculadora')">Nueva Conversion</button>
      <button class="btn btn-info btn-lg text-white" onclick="alert('Proximamente: Historial')">Ver Historial Completo</button>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white">
        <h5 class="mb-0">Ultimos Movimientos</h5>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped mb-0">
            <thead>
              <tr>
                <th>Fecha Recibo</th>
                <th>Monto Pesos</th>
                <th>Monto Euros</th>
                <th>Banco</th>
              </tr>
            </thead>
            <tbody id="tabla-cobros">
              <tr><td colspan="4" class="text-center">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- 1. Cargar Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <!-- 2. Cargar Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- 3. Tu cÃ³digo de conexiÃ³n -->
  <script src="js/db.js"></script>

  <!-- 4. CÃ³digo de la app (aquÃ­ mismo, despuÃ©s de todo) -->
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Esperar un momento a que Supabase estÃ© listo
      let intentos = 0;
      while (typeof window.supabase === 'undefined' || !window.supabase.from) {
        await new Promise(r => setTimeout(r, 200));
        intentos++;
        if (intentos > 20) {
          document.getElementById('tabla-cobros').innerHTML = '<tr><td colspan="4" class="text-center text-danger">Error: Supabase no carga.</td></tr>';
          return;
        }
      }

      const app = document.getElementById('tabla-cobros');
      
      try {
        const { data, error } = await window.supabase
          .from('cobros')
          .select('*')
          .order('recibo_vision_fecha', { ascending: false })
          .limit(10);

        if (error) throw error;

        if (!data || data.length === 0) {
          app.innerHTML = '<tr><td colspan="4" class="text-center text-muted">No hay datos.</td></tr>';
          return;
        }

        let html = '';
        let totalEuros = 0;
        
        data.forEach(cobro => {
          if (cobro.monto_euros) totalEuros += parseFloat(cobro.monto_euros);
          html += `
            <tr>
              <td>${cobro.recibo_vision_fecha || '-'}</td>
              <td>$${cobro.monto_pesos ? cobro.monto_pesos.toLocaleString('es-AR') : '-'}</td>
              <td>â‚¬${cobro.monto_euros ? cobro.monto_euros.toLocaleString('es-ES') : '-'}</td>
              <td><small>${cobro.banco_detalle || '-'}</small></td>
            </tr>
          `;
        });
        app.innerHTML = html;

        const ultimo = data[0];
        document.getElementById('ultimo-cobro').innerText = `â‚¬${ultimo.monto_euros ? ultimo.monto_euros.toLocaleString('es-ES') : 'Pendiente'}`;
        document.getElementById('total-historico').innerText = `â‚¬${totalEuros.toLocaleString('es-ES')}`;

        const panel = document.getElementById('panel-supervivencia');
        panel.className = 'card mb-4 shadow-sm border-success';
        panel.querySelector('.card-body').classList.add('bg-success', 'text-white');
        document.getElementById('supervivencia-texto').innerHTML = `
          <strong>Todo en orden</strong><br>
          Proximo tramite estimado: <strong>${new Date(new Date(ultimo.recibo_vision_fecha).setMonth(new Date(ultimo.recibo_vision_fecha).getMonth() + 5)).toLocaleDateString('es-ES')}</strong>
        `;

      } catch (error) {
        console.error('Error:', error);
        app.innerHTML = `<tr><td colspan="4" class="text-center text-danger">Error: ${error.message}</td></tr>`;
      }
    });
  </script>
</body>
</html>
